# Step1: Pipeline ka name
name: RG Pipeline

# Step2: Kab chalega
on:
  push:
    branches:
      - 'feature/*'

# Step3: aapko kya kaam krna hai 
jobs:
  scan:
    # Step4: kaam kis laptop mai hoga 
    runs-on: ubuntu-latest
    
    # Step5: ubuntu mai kaam krna kya hai  
    steps:
      - name: Github Copy kr rha hai code ko aapne computer mai
        uses: actions/checkout@v4
      
      - name: Install Terraform (Setup terraform)
        uses: hashicorp/setup-terraform@v3 # Updated to v3 for latest runner support
      
      - name: terraform version check
        run: terraform version

      - name: Azure Login using secret
        uses: azure/login@v2 # Updated to v2 (more stable)
        with:
          creds: ${{ secrets.ENV_SET }}

      - name: terraform init
        run: terraform init

      - name: terraform fmt
        run: terraform fmt
      
      - name: terraform validate
        run: terraform validate

  plan: 
    name: Manual Approval and Plan
    needs: scan 
    runs-on: ubuntu-latest
    environment: production 
    
    steps: 
      - name: Github Copy kr rha hai code ko aapne computer mai
        uses: actions/checkout@v4
      
      - name: Install Terraform (Setup terraform)
        uses: hashicorp/setup-terraform@v3
      
      - name: Azure Login using secret
        uses: azure/login@v2
        with:
          creds: ${{ secrets.ENV_SET }}
          
      - name: terraform init
        run: terraform init

      - name: Terraform Plan
        run: terraform plan
